# ============================================================
# Keybinds
# ============================================================

# Send literal Ctrl+b (was tmux send-prefix)
map ctrl+b>ctrl+b send_text all \x02

# Splits open in current dir (was bind % " with -c pane_current_path)
map ctrl+b>shift+5 launch --location=vsplit --cwd=current
map ctrl+b>shift+' launch --location=hsplit --cwd=current

# Pane focus. Left/Right are tabs per your tmux.conf below,
# so hjkl covers all directions.
map ctrl+b>h neighboring_window left
map ctrl+b>j neighboring_window bottom
map ctrl+b>k neighboring_window top
map ctrl+b>l neighboring_window right
map ctrl+b>up neighboring_window up
map ctrl+b>down neighboring_window down
map ctrl+b>o next_window
map ctrl+b>; nth_window -1

# Swap pane (was tmux { })
map ctrl+b>shift+[ move_window left
map ctrl+b>shift+] move_window right
map ctrl+b>ctrl+o layout_action rotate

# Close and zoom pane (was tmux x and z)
map ctrl+b>x close_window
map ctrl+b>z toggle_layout stack
map ctrl+b>ctrl+left resize_window narrower 3
map ctrl+b>ctrl+right resize_window wider 3
map ctrl+b>ctrl+up resize_window taller 3
map ctrl+b>ctrl+down resize_window shorter 3
map ctrl+b>ctrl+z resize_window reset

# Break pane into its own tab (was tmux !)
map ctrl+b>! detach_window ask

# New tab in current dir (was bind c with -c pane_current_path)
map ctrl+b>c new_tab_with_cwd

# Next/prev tab (was tmux n/p)
map ctrl+b>n next_tab
map ctrl+b>p previous_tab

# Tab by number. Kitty is 1-indexed like your base-index 1.
map ctrl+b>1 goto_tab 1
map ctrl+b>2 goto_tab 2
map ctrl+b>3 goto_tab 3
map ctrl+b>4 goto_tab 4
map ctrl+b>5 goto_tab 5
map ctrl+b>6 goto_tab 6
map ctrl+b>7 goto_tab 7
map ctrl+b>8 goto_tab 8
map ctrl+b>9 goto_tab 9

# Move tab.
map ctrl+b>left move_tab_backward
map ctrl+b>right move_tab_forward

# Picker and command prompt (was tmux w and :)
map ctrl+b>w select_tab
map ctrl+b>shift+/ command_palette

